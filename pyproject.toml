[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-knowledge-qa"
version = "0.1.0"
description = "Auditable Chinese drug leaflet PDF ingestion"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.24,<2",
  "pdfplumber>=0.11,<1",
  "PyMySQL>=1.1,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.setuptools.packages.find]
include = ["app*"]
